databaseChangeLog:
  - changeSet:
      id: "2-insert-users"
      author: "Marat Bulekbayev"
      preConditions:
        - sqlCheck:
            sql: "SELECT COUNT(*) FROM users WHERE email = 'john.doe@example.com'"
            expectedResult: "0"
        - sqlCheck:
            sql: "SELECT COUNT(*) FROM users WHERE email = 'joanna.doe@example.com'"
            expectedResult: "0"
      changes:
        - insert:
            tableName: users
            columns:
              - column:
                  name: first_name
                  value: John
              - column:
                  name: last_name
                  value: Doe
              - column:
                  name: email
                  value: john.doe@example.com
              - column:
                  name: password
                  value: "$2a$12$D6Ur0MJT0klFuclfl35s5eUo/krWuR2eQ3qhKnyy92PPbyXzTvguy"
              - column:
                  name: role
                  value: ADMIN
        - insert:
            tableName: users
            columns:
              - column:
                  name: first_name
                  value: Joanna
              - column:
                  name: last_name
                  value: Doe
              - column:
                  name: email
                  value: joanna.doe@example.com
              - column:
                  name: password
                  value: "$2a$12$D6Ur0MJT0klFuclfl35s5eUo/krWuR2eQ3qhKnyy92PPbyXzTvguy"
              - column:
                  name: role
                  value: USER
