databaseChangeLog:
  - changeSet:
      id: "2-create-tasks-table"
      author: "Marat Bulekbayev"
      preConditions:
        - not:
            - tableExists:
                tableName: tasks
      changes:
        - createTable:
            tableName: tasks
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: priority
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: author_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: assignee_id
                  type: BIGINT

        - addForeignKeyConstraint:
            baseTableName: tasks
            baseColumnNames: author_id
            constraintName: fk_tasks_author
            referencedTableName: users
            referencedColumnNames: id
            onDelete: SET NULL

        - addForeignKeyConstraint:
            baseTableName: tasks
            baseColumnNames: assignee_id
            constraintName: fk_tasks_assignee
            referencedTableName: users
            referencedColumnNames: id
            onDelete: SET NULL