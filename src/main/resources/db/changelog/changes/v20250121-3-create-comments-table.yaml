databaseChangeLog:
  - changeSet:
      id: "3-create-comments-table"
      author: "Marat Bulekbayev"
      preConditions:
        - not:
            - tableExists:
                tableName: comments
      changes:
        - createTable:
            tableName: comments
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: content
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: task_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: comments
            baseColumnNames: task_id
            constraintName: fk_comments_task
            referencedTableName: tasks
            referencedColumnNames: id
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: comments
            baseColumnNames: user_id
            constraintName: fk_comments_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: SET NULL